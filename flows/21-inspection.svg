<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 409" width="680" height="409" role="img" aria-label="An inspection pass"><style>text{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif}.s{stroke:#C9D0DC}.s-School{fill:#E8EEFF}.s-Teacher{fill:#E3F4EC}.s-Headteacher{fill:#FFF1D6}.s-Reviewer{fill:#F3E8FF}.s-Coordinator{fill:#FFE7E7}.s-Officer{fill:#E6F6F8}.s-EduNex{fill:#ECEFF4}.s-App{fill:#F2F4F7}.n{fill:#fff;stroke:#9AA3B5}.nt{font-size:13px;font-weight:700;fill:#1F2633}.b{font-size:12px;font-weight:700;fill:#fff}.t{font-size:15px;fill:#1F2633}.q{fill:#FFF8E1;stroke:#E0B54A}.qt{font-size:15px;font-weight:700;fill:#3D2C08}.a{fill:#fff;stroke:#E0B54A}.al{font-size:13px;font-weight:700;fill:#8A5A00}.at{font-size:14px;fill:#1F2633}.arrow{fill:none;stroke:#8A93A6;stroke-width:2}.head{fill:#8A93A6}</style><rect width="680" height="409" fill="#ffffff"/><title>An inspection pass</title><rect class="s s-Headteacher" x="24" y="24" width="632" height="88" rx="12"/><circle class="n" cx="50" cy="50" r="14"/><text class="nt" x="50" y="55" text-anchor="middle">1</text><rect x="74" y="38" width="93.2" height="24" rx="12" fill="#B7791F"/><text class="b" x="81" y="55">Headteacher</text><text class="t" x="74" y="81"><tspan x="74" dy="0">Issues a pass: the officer&#x27;s name, what they may see, and for how</tspan><tspan x="74" dy="19">long.</tspan></text><path class="arrow" d="M340.0,114 L340.0,128"/><polygon class="head" points="335.0,124 345.0,124 340.0,132"/><rect class="s s-Headteacher" x="24" y="134" width="632" height="69" rx="12"/><circle class="n" cx="50" cy="160" r="14"/><text class="nt" x="50" y="165" text-anchor="middle">2</text><rect x="74" y="148" width="93.2" height="24" rx="12" fill="#B7791F"/><text class="b" x="81" y="165">Headteacher</text><text class="t" x="74" y="191"><tspan x="74" dy="0">Gives the officer the link (shown once).</tspan></text><path class="arrow" d="M340.0,205 L340.0,219"/><polygon class="head" points="335.0,215 345.0,215 340.0,223"/><rect class="s s-Officer" x="24" y="225" width="632" height="69" rx="12"/><circle class="n" cx="50" cy="251" r="14"/><text class="nt" x="50" y="256" text-anchor="middle">3</text><rect x="74" y="239" width="143.6" height="24" rx="12" fill="#0E7490"/><text class="b" x="81" y="256">Inspecting officer</text><text class="t" x="74" y="282"><tspan x="74" dy="0">Opens the link and reads approved lesson plans only.</tspan></text><path class="arrow" d="M340.0,296 L340.0,310"/><polygon class="head" points="335.0,306 345.0,306 340.0,314"/><rect class="s s-Headteacher" x="24" y="316" width="632" height="69" rx="12"/><circle class="n" cx="50" cy="342" r="14"/><text class="nt" x="50" y="347" text-anchor="middle">4</text><rect x="74" y="330" width="93.2" height="24" rx="12" fill="#B7791F"/><text class="b" x="81" y="347">Headteacher</text><text class="t" x="74" y="373"><tspan x="74" dy="0">Sees how often it was used, and can revoke it at any time.</tspan></text></svg>