<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 629" width="680" height="629" role="img" aria-label="Setting up the school"><style>text{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif}.s{stroke:#C9D0DC}.s-School{fill:#E8EEFF}.s-Teacher{fill:#E3F4EC}.s-Headteacher{fill:#FFF1D6}.s-Reviewer{fill:#F3E8FF}.s-Coordinator{fill:#FFE7E7}.s-Officer{fill:#E6F6F8}.s-EduNex{fill:#ECEFF4}.s-App{fill:#F2F4F7}.n{fill:#fff;stroke:#9AA3B5}.nt{font-size:13px;font-weight:700;fill:#1F2633}.b{font-size:12px;font-weight:700;fill:#fff}.t{font-size:15px;fill:#1F2633}.q{fill:#FFF8E1;stroke:#E0B54A}.qt{font-size:15px;font-weight:700;fill:#3D2C08}.a{fill:#fff;stroke:#E0B54A}.al{font-size:13px;font-weight:700;fill:#8A5A00}.at{font-size:14px;fill:#1F2633}.arrow{fill:none;stroke:#8A93A6;stroke-width:2}.head{fill:#8A93A6}</style><rect width="680" height="629" fill="#ffffff"/><title>Setting up the school</title><rect class="s s-School" x="24" y="24" width="632" height="69" rx="12"/><circle class="n" cx="50" cy="50" r="14"/><text class="nt" x="50" y="55" text-anchor="middle">1</text><rect x="74" y="38" width="57.2" height="24" rx="12" fill="#3D6BF0"/><text class="b" x="81" y="55">School</text><text class="t" x="74" y="81"><tspan x="74" dy="0">School profile: names, code, address and logo.</tspan></text><path class="arrow" d="M340.0,95 L340.0,109"/><polygon class="head" points="335.0,105 345.0,105 340.0,113"/><rect class="s s-School" x="24" y="115" width="632" height="69" rx="12"/><circle class="n" cx="50" cy="141" r="14"/><text class="nt" x="50" y="146" text-anchor="middle">2</text><rect x="74" y="129" width="57.2" height="24" rx="12" fill="#3D6BF0"/><text class="b" x="81" y="146">School</text><text class="t" x="74" y="172"><tspan x="74" dy="0">Calendar: the school year, terms, school days and holidays.</tspan></text><path class="arrow" d="M340.0,186 L340.0,200"/><polygon class="head" points="335.0,196 345.0,196 340.0,204"/><rect class="s s-School" x="24" y="206" width="632" height="88" rx="12"/><circle class="n" cx="50" cy="232" r="14"/><text class="nt" x="50" y="237" text-anchor="middle">3</text><rect x="74" y="220" width="57.2" height="24" rx="12" fill="#3D6BF0"/><text class="b" x="81" y="237">School</text><text class="t" x="74" y="263"><tspan x="74" dy="0">Staff: approve teachers, form groups, name reviewers and give duties</tspan><tspan x="74" dy="19">with dates.</tspan></text><path class="arrow" d="M340.0,296 L340.0,310"/><polygon class="head" points="335.0,306 345.0,306 340.0,314"/><rect class="s s-School" x="24" y="316" width="632" height="88" rx="12"/><circle class="n" cx="50" cy="342" r="14"/><text class="nt" x="50" y="347" text-anchor="middle">4</text><rect x="74" y="330" width="57.2" height="24" rx="12" fill="#3D6BF0"/><text class="b" x="81" y="347">School</text><text class="t" x="74" y="373"><tspan x="74" dy="0">Classes and pupils: type them in or import an Excel sheet, check the</tspan><tspan x="74" dy="19">preview, confirm.</tspan></text><path class="arrow" d="M340.0,406 L340.0,420"/><polygon class="head" points="335.0,416 345.0,416 340.0,424"/><rect class="s s-School" x="24" y="426" width="632" height="88" rx="12"/><circle class="n" cx="50" cy="452" r="14"/><text class="nt" x="50" y="457" text-anchor="middle">5</text><rect x="74" y="440" width="57.2" height="24" rx="12" fill="#3D6BF0"/><text class="b" x="81" y="457">School</text><text class="t" x="74" y="483"><tspan x="74" dy="0">Curriculum: plan each subject&#x27;s yearly teaching plan (RPT) from the</tspan><tspan x="74" dy="19">DSKP.</tspan></text><path class="arrow" d="M340.0,516 L340.0,530"/><polygon class="head" points="335.0,526 345.0,526 340.0,534"/><rect class="s s-App" x="24" y="536" width="632" height="69" rx="12"/><circle class="n" cx="50" cy="562" r="14"/><text class="nt" x="50" y="567" text-anchor="middle">6</text><rect x="74" y="550" width="86.0" height="24" rx="12" fill="#6B7280"/><text class="b" x="81" y="567">EduNex app</text><text class="t" x="74" y="593"><tspan x="74" dy="0">Data checks list anything missing or doubtful, to fix or explain.</tspan></text></svg>