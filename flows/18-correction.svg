<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" width="680" height="390" role="img" aria-label="Correcting an approved plan"><style>text{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif}.s{stroke:#C9D0DC}.s-School{fill:#E8EEFF}.s-Teacher{fill:#E3F4EC}.s-Headteacher{fill:#FFF1D6}.s-Reviewer{fill:#F3E8FF}.s-Coordinator{fill:#FFE7E7}.s-Officer{fill:#E6F6F8}.s-EduNex{fill:#ECEFF4}.s-App{fill:#F2F4F7}.n{fill:#fff;stroke:#9AA3B5}.nt{font-size:13px;font-weight:700;fill:#1F2633}.b{font-size:12px;font-weight:700;fill:#fff}.t{font-size:15px;fill:#1F2633}.q{fill:#FFF8E1;stroke:#E0B54A}.qt{font-size:15px;font-weight:700;fill:#3D2C08}.a{fill:#fff;stroke:#E0B54A}.al{font-size:13px;font-weight:700;fill:#8A5A00}.at{font-size:14px;fill:#1F2633}.arrow{fill:none;stroke:#8A93A6;stroke-width:2}.head{fill:#8A93A6}</style><rect width="680" height="390" fill="#ffffff"/><title>Correcting an approved plan</title><rect class="s s-Teacher" x="24" y="24" width="632" height="69" rx="12"/><circle class="n" cx="50" cy="50" r="14"/><text class="nt" x="50" y="55" text-anchor="middle">1</text><rect x="74" y="38" width="64.4" height="24" rx="12" fill="#0E7F53"/><text class="b" x="81" y="55">Teacher</text><text class="t" x="74" y="81"><tspan x="74" dy="0">Asks for a correction and says why.</tspan></text><path class="arrow" d="M340.0,95 L340.0,109"/><polygon class="head" points="335.0,105 345.0,105 340.0,113"/><rect class="s s-Reviewer" x="24" y="115" width="632" height="69" rx="12"/><circle class="n" cx="50" cy="141" r="14"/><text class="nt" x="50" y="146" text-anchor="middle">2</text><rect x="74" y="129" width="71.6" height="24" rx="12" fill="#7C3AED"/><text class="b" x="81" y="146">Reviewer</text><text class="t" x="74" y="172"><tspan x="74" dy="0">Allows it, for the parts that need changing.</tspan></text><path class="arrow" d="M340.0,186 L340.0,200"/><polygon class="head" points="335.0,196 345.0,196 340.0,204"/><rect class="s s-Teacher" x="24" y="206" width="632" height="69" rx="12"/><circle class="n" cx="50" cy="232" r="14"/><text class="nt" x="50" y="237" text-anchor="middle">3</text><rect x="74" y="220" width="64.4" height="24" rx="12" fill="#0E7F53"/><text class="b" x="81" y="237">Teacher</text><text class="t" x="74" y="263"><tspan x="74" dy="0">Edits the new version and submits it.</tspan></text><path class="arrow" d="M340.0,277 L340.0,291"/><polygon class="head" points="335.0,287 345.0,287 340.0,295"/><rect class="s s-Reviewer" x="24" y="297" width="632" height="69" rx="12"/><circle class="n" cx="50" cy="323" r="14"/><text class="nt" x="50" y="328" text-anchor="middle">4</text><rect x="74" y="311" width="71.6" height="24" rx="12" fill="#7C3AED"/><text class="b" x="81" y="328">Reviewer</text><text class="t" x="74" y="354"><tspan x="74" dy="0">Reviews it. The original stays on record beside it.</tspan></text></svg>