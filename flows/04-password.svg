<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="680" height="500" role="img" aria-label="Forgotten password"><style>text{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif}.s{stroke:#C9D0DC}.s-School{fill:#E8EEFF}.s-Teacher{fill:#E3F4EC}.s-Headteacher{fill:#FFF1D6}.s-Reviewer{fill:#F3E8FF}.s-Coordinator{fill:#FFE7E7}.s-Officer{fill:#E6F6F8}.s-EduNex{fill:#ECEFF4}.s-App{fill:#F2F4F7}.n{fill:#fff;stroke:#9AA3B5}.nt{font-size:13px;font-weight:700;fill:#1F2633}.b{font-size:12px;font-weight:700;fill:#fff}.t{font-size:15px;fill:#1F2633}.q{fill:#FFF8E1;stroke:#E0B54A}.qt{font-size:15px;font-weight:700;fill:#3D2C08}.a{fill:#fff;stroke:#E0B54A}.al{font-size:13px;font-weight:700;fill:#8A5A00}.at{font-size:14px;fill:#1F2633}.arrow{fill:none;stroke:#8A93A6;stroke-width:2}.head{fill:#8A93A6}</style><rect width="680" height="500" fill="#ffffff"/><title>Forgotten password</title><rect class="s s-Teacher" x="24" y="24" width="632" height="69" rx="12"/><circle class="n" cx="50" cy="50" r="14"/><text class="nt" x="50" y="55" text-anchor="middle">1</text><rect x="74" y="38" width="64.4" height="24" rx="12" fill="#0E7F53"/><text class="b" x="81" y="55">Teacher</text><text class="t" x="74" y="81"><tspan x="74" dy="0">Taps “Forgot password?” and enters their email.</tspan></text><path class="arrow" d="M340.0,95 L340.0,109"/><polygon class="head" points="335.0,105 345.0,105 340.0,113"/><rect class="s s-App" x="24" y="115" width="632" height="69" rx="12"/><circle class="n" cx="50" cy="141" r="14"/><text class="nt" x="50" y="146" text-anchor="middle">2</text><rect x="74" y="129" width="86.0" height="24" rx="12" fill="#6B7280"/><text class="b" x="81" y="146">EduNex app</text><text class="t" x="74" y="172"><tspan x="74" dy="0">Emails a 6-digit code that works for 10 minutes.</tspan></text><path class="arrow" d="M340.0,186 L340.0,200"/><polygon class="head" points="335.0,196 345.0,196 340.0,204"/><rect class="s s-Teacher" x="24" y="206" width="632" height="69" rx="12"/><circle class="n" cx="50" cy="232" r="14"/><text class="nt" x="50" y="237" text-anchor="middle">3</text><rect x="74" y="220" width="64.4" height="24" rx="12" fill="#0E7F53"/><text class="b" x="81" y="237">Teacher</text><text class="t" x="74" y="263"><tspan x="74" dy="0">Enters the code and chooses a new password.</tspan></text><path class="arrow" d="M340.0,277 L340.0,291"/><polygon class="head" points="335.0,287 345.0,287 340.0,295"/><rect class="s s-App" x="24" y="297" width="632" height="88" rx="12"/><circle class="n" cx="50" cy="323" r="14"/><text class="nt" x="50" y="328" text-anchor="middle">4</text><rect x="74" y="311" width="86.0" height="24" rx="12" fill="#6B7280"/><text class="b" x="81" y="328">EduNex app</text><text class="t" x="74" y="354"><tspan x="74" dy="0">Signs the account out on every device and emails the owner that the</tspan><tspan x="74" dy="19">password changed.</tspan></text><path class="arrow" d="M340.0,387 L340.0,401"/><polygon class="head" points="335.0,397 345.0,397 340.0,405"/><rect class="s s-Teacher" x="24" y="407" width="632" height="69" rx="12"/><circle class="n" cx="50" cy="433" r="14"/><text class="nt" x="50" y="438" text-anchor="middle">5</text><rect x="74" y="421" width="64.4" height="24" rx="12" fill="#0E7F53"/><text class="b" x="81" y="438">Teacher</text><text class="t" x="74" y="464"><tspan x="74" dy="0">Signs in with the new password.</tspan></text></svg>