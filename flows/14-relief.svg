<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 673" width="680" height="673" role="img" aria-label="A teacher is away: Smart Relief"><style>text{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif}.s{stroke:#C9D0DC}.s-School{fill:#E8EEFF}.s-Teacher{fill:#E3F4EC}.s-Headteacher{fill:#FFF1D6}.s-Reviewer{fill:#F3E8FF}.s-Coordinator{fill:#FFE7E7}.s-Officer{fill:#E6F6F8}.s-EduNex{fill:#ECEFF4}.s-App{fill:#F2F4F7}.n{fill:#fff;stroke:#9AA3B5}.nt{font-size:13px;font-weight:700;fill:#1F2633}.b{font-size:12px;font-weight:700;fill:#fff}.t{font-size:15px;fill:#1F2633}.q{fill:#FFF8E1;stroke:#E0B54A}.qt{font-size:15px;font-weight:700;fill:#3D2C08}.a{fill:#fff;stroke:#E0B54A}.al{font-size:13px;font-weight:700;fill:#8A5A00}.at{font-size:14px;fill:#1F2633}.arrow{fill:none;stroke:#8A93A6;stroke-width:2}.head{fill:#8A93A6}</style><rect width="680" height="673" fill="#ffffff"/><title>A teacher is away: Smart Relief</title><rect class="s s-Coordinator" x="24" y="24" width="632" height="69" rx="12"/><circle class="n" cx="50" cy="50" r="14"/><text class="nt" x="50" y="55" text-anchor="middle">1</text><rect x="74" y="38" width="143.6" height="24" rx="12" fill="#CC0001"/><text class="b" x="81" y="55">Relief coordinator</text><text class="t" x="74" y="81"><tspan x="74" dy="0">Records the absence: who, which days or periods, and the reason.</tspan></text><path class="arrow" d="M340.0,95 L340.0,109"/><polygon class="head" points="335.0,105 345.0,105 340.0,113"/><rect class="s s-App" x="24" y="115" width="632" height="69" rx="12"/><circle class="n" cx="50" cy="141" r="14"/><text class="nt" x="50" y="146" text-anchor="middle">2</text><rect x="74" y="129" width="86.0" height="24" rx="12" fill="#6B7280"/><text class="b" x="81" y="146">EduNex app</text><text class="t" x="74" y="172"><tspan x="74" dy="0">Lists every lesson that needs cover.</tspan></text><path class="arrow" d="M340.0,186 L340.0,200"/><polygon class="head" points="335.0,196 345.0,196 340.0,204"/><rect class="q" x="24" y="206" width="632" height="45" rx="12"/><text class="qt" x="42" y="232"><tspan x="42" dy="0">A free teacher under the daily limit?</tspan></text><path class="arrow" d="M340.0,251 L340.0,261 L178.5,261 L178.5,269"/><polygon class="head" points="173.5,264 183.5,264 178.5,272"/><rect class="a" x="24.0" y="273" width="309.0" height="84" rx="10"/><text class="al" x="38.0" y="295">Yes</text><text class="at" x="38.0" y="316"><tspan x="38.0" dy="0">Picks the fairest one automatically (or</tspan><tspan x="38.0" dy="19">the coordinator chooses).</tspan></text><path class="arrow" d="M340.0,251 L340.0,261 L501.5,261 L501.5,269"/><polygon class="head" points="496.5,264 506.5,264 501.5,272"/><rect class="a" x="347.0" y="273" width="309.0" height="84" rx="10"/><text class="al" x="361.0" y="295">No</text><text class="at" x="361.0" y="316"><tspan x="361.0" dy="0">The lesson stays Unfilled for the</tspan><tspan x="361.0" dy="19">coordinator to handle.</tspan></text><path class="arrow" d="M178.5,359 L178.5,373"/><polygon class="head" points="173.5,369 183.5,369 178.5,377"/><rect class="s s-Teacher" x="24" y="379" width="632" height="88" rx="12"/><circle class="n" cx="50" cy="405" r="14"/><text class="nt" x="50" y="410" text-anchor="middle">3</text><rect x="74" y="393" width="64.4" height="24" rx="12" fill="#0E7F53"/><text class="b" x="81" y="410">Teacher</text><text class="t" x="74" y="436"><tspan x="74" dy="0">The relief teacher gets a notice and the relief slip (never the reason</tspan><tspan x="74" dy="19">for the absence).</tspan></text><path class="arrow" d="M340.0,469 L340.0,483"/><polygon class="head" points="335.0,479 345.0,479 340.0,487"/><rect class="s s-Teacher" x="24" y="489" width="632" height="69" rx="12"/><circle class="n" cx="50" cy="515" r="14"/><text class="nt" x="50" y="520" text-anchor="middle">4</text><rect x="74" y="503" width="64.4" height="24" rx="12" fill="#0E7F53"/><text class="b" x="81" y="520">Teacher</text><text class="t" x="74" y="546"><tspan x="74" dy="0">Acknowledges the duty, teaches, then marks it completed.</tspan></text><path class="arrow" d="M340.0,560 L340.0,574"/><polygon class="head" points="335.0,570 345.0,570 340.0,578"/><rect class="s s-Headteacher" x="24" y="580" width="632" height="69" rx="12"/><circle class="n" cx="50" cy="606" r="14"/><text class="nt" x="50" y="611" text-anchor="middle">5</text><rect x="74" y="594" width="93.2" height="24" rx="12" fill="#B7791F"/><text class="b" x="81" y="611">Headteacher</text><text class="t" x="74" y="637"><tspan x="74" dy="0">Prints the day&#x27;s relief board or the workload report (PDF or Word).</tspan></text></svg>