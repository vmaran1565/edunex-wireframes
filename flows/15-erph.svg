<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 789" width="680" height="789" role="img" aria-label="A lesson plan from start to approval"><style>text{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif}.s{stroke:#C9D0DC}.s-School{fill:#E8EEFF}.s-Teacher{fill:#E3F4EC}.s-Headteacher{fill:#FFF1D6}.s-Reviewer{fill:#F3E8FF}.s-Coordinator{fill:#FFE7E7}.s-Officer{fill:#E6F6F8}.s-EduNex{fill:#ECEFF4}.s-App{fill:#F2F4F7}.n{fill:#fff;stroke:#9AA3B5}.nt{font-size:13px;font-weight:700;fill:#1F2633}.b{font-size:12px;font-weight:700;fill:#fff}.t{font-size:15px;fill:#1F2633}.q{fill:#FFF8E1;stroke:#E0B54A}.qt{font-size:15px;font-weight:700;fill:#3D2C08}.a{fill:#fff;stroke:#E0B54A}.al{font-size:13px;font-weight:700;fill:#8A5A00}.at{font-size:14px;fill:#1F2633}.arrow{fill:none;stroke:#8A93A6;stroke-width:2}.head{fill:#8A93A6}</style><rect width="680" height="789" fill="#ffffff"/><title>A lesson plan from start to approval</title><rect class="s s-Teacher" x="24" y="24" width="632" height="69" rx="12"/><circle class="n" cx="50" cy="50" r="14"/><text class="nt" x="50" y="55" text-anchor="middle">1</text><rect x="74" y="38" width="64.4" height="24" rx="12" fill="#0E7F53"/><text class="b" x="81" y="55">Teacher</text><text class="t" x="74" y="81"><tspan x="74" dy="0">My Timetable → picks a lesson → Create plan.</tspan></text><path class="arrow" d="M340.0,95 L340.0,109"/><polygon class="head" points="335.0,105 345.0,105 340.0,113"/><rect class="s s-Teacher" x="24" y="115" width="632" height="88" rx="12"/><circle class="n" cx="50" cy="141" r="14"/><text class="nt" x="50" y="146" text-anchor="middle">2</text><rect x="74" y="129" width="64.4" height="24" rx="12" fill="#0E7F53"/><text class="b" x="81" y="146">Teacher</text><text class="t" x="74" y="172"><tspan x="74" dy="0">Chooses the SK and SP, writes objectives and activities (or applies a</tspan><tspan x="74" dy="19">template), and saves.</tspan></text><path class="arrow" d="M340.0,205 L340.0,219"/><polygon class="head" points="335.0,215 345.0,215 340.0,223"/><rect class="s s-Teacher" x="24" y="225" width="632" height="69" rx="12"/><circle class="n" cx="50" cy="251" r="14"/><text class="nt" x="50" y="256" text-anchor="middle">3</text><rect x="74" y="239" width="64.4" height="24" rx="12" fill="#0E7F53"/><text class="b" x="81" y="256">Teacher</text><text class="t" x="74" y="282"><tspan x="74" dy="0">Submits the plan before the lesson.</tspan></text><path class="arrow" d="M340.0,296 L340.0,310"/><polygon class="head" points="335.0,306 345.0,306 340.0,314"/><rect class="s s-Teacher" x="24" y="316" width="632" height="88" rx="12"/><circle class="n" cx="50" cy="342" r="14"/><text class="nt" x="50" y="347" text-anchor="middle">4</text><rect x="74" y="330" width="64.4" height="24" rx="12" fill="#0E7F53"/><text class="b" x="81" y="347">Teacher</text><text class="t" x="74" y="373"><tspan x="74" dy="0">After teaching, writes the reflection: attendance, how many achieved,</tspan><tspan x="74" dy="19">what to follow up.</tspan></text><path class="arrow" d="M340.0,406 L340.0,420"/><polygon class="head" points="335.0,416 345.0,416 340.0,424"/><rect class="s s-App" x="24" y="426" width="632" height="69" rx="12"/><circle class="n" cx="50" cy="452" r="14"/><text class="nt" x="50" y="457" text-anchor="middle">5</text><rect x="74" y="440" width="86.0" height="24" rx="12" fill="#6B7280"/><text class="b" x="81" y="457">EduNex app</text><text class="t" x="74" y="483"><tspan x="74" dy="0">Submitting the reflection locks all six sections.</tspan></text><path class="arrow" d="M340.0,497 L340.0,511"/><polygon class="head" points="335.0,507 345.0,507 340.0,515"/><rect class="s s-Reviewer" x="24" y="517" width="632" height="69" rx="12"/><circle class="n" cx="50" cy="543" r="14"/><text class="nt" x="50" y="548" text-anchor="middle">6</text><rect x="74" y="531" width="71.6" height="24" rx="12" fill="#7C3AED"/><text class="b" x="81" y="548">Reviewer</text><text class="t" x="74" y="574"><tspan x="74" dy="0">Reviews the plan.</tspan></text><path class="arrow" d="M340.0,588 L340.0,602"/><polygon class="head" points="335.0,598 345.0,598 340.0,606"/><rect class="q" x="24" y="608" width="632" height="45" rx="12"/><text class="qt" x="42" y="634"><tspan x="42" dy="0">Decision</tspan></text><path class="arrow" d="M340.0,653 L340.0,663 L178.5,663 L178.5,671"/><polygon class="head" points="173.5,666 183.5,666 178.5,674"/><rect class="a" x="24.0" y="675" width="309.0" height="84" rx="10"/><text class="al" x="38.0" y="697">Approve</text><text class="at" x="38.0" y="718"><tspan x="38.0" dy="0">The plan is approved and counts in</tspan><tspan x="38.0" dy="19">syllabus progress.</tspan></text><path class="arrow" d="M340.0,653 L340.0,663 L501.5,663 L501.5,671"/><polygon class="head" points="496.5,666 506.5,666 501.5,674"/><rect class="a" x="347.0" y="675" width="309.0" height="84" rx="10"/><text class="al" x="361.0" y="697">Refer back</text><text class="at" x="361.0" y="718"><tspan x="361.0" dy="0">The teacher gets the comments and</tspan><tspan x="361.0" dy="19">corrects it.</tspan></text></svg>