<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 673" width="680" height="673" role="img" aria-label="A school registers"><style>text{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif}.s{stroke:#C9D0DC}.s-School{fill:#E8EEFF}.s-Teacher{fill:#E3F4EC}.s-Headteacher{fill:#FFF1D6}.s-Reviewer{fill:#F3E8FF}.s-Coordinator{fill:#FFE7E7}.s-Officer{fill:#E6F6F8}.s-EduNex{fill:#ECEFF4}.s-App{fill:#F2F4F7}.n{fill:#fff;stroke:#9AA3B5}.nt{font-size:13px;font-weight:700;fill:#1F2633}.b{font-size:12px;font-weight:700;fill:#fff}.t{font-size:15px;fill:#1F2633}.q{fill:#FFF8E1;stroke:#E0B54A}.qt{font-size:15px;font-weight:700;fill:#3D2C08}.a{fill:#fff;stroke:#E0B54A}.al{font-size:13px;font-weight:700;fill:#8A5A00}.at{font-size:14px;fill:#1F2633}.arrow{fill:none;stroke:#8A93A6;stroke-width:2}.head{fill:#8A93A6}</style><rect width="680" height="673" fill="#ffffff"/><title>A school registers</title><rect class="s s-EduNex" x="24" y="24" width="632" height="69" rx="12"/><circle class="n" cx="50" cy="50" r="14"/><text class="nt" x="50" y="55" text-anchor="middle">1</text><rect x="74" y="38" width="93.2" height="24" rx="12" fill="#4B5563"/><text class="b" x="81" y="55">EduNex team</text><text class="t" x="74" y="81"><tspan x="74" dy="0">Sends the school a registration link or QR code.</tspan></text><path class="arrow" d="M340.0,95 L340.0,109"/><polygon class="head" points="335.0,105 345.0,105 340.0,113"/><rect class="s s-School" x="24" y="115" width="632" height="69" rx="12"/><circle class="n" cx="50" cy="141" r="14"/><text class="nt" x="50" y="146" text-anchor="middle">2</text><rect x="74" y="129" width="57.2" height="24" rx="12" fill="#3D6BF0"/><text class="b" x="81" y="146">School</text><text class="t" x="74" y="172"><tspan x="74" dy="0">Fills in the school&#x27;s details and logo. The form saves as a draft.</tspan></text><path class="arrow" d="M340.0,186 L340.0,200"/><polygon class="head" points="335.0,196 345.0,196 340.0,204"/><rect class="s s-School" x="24" y="206" width="632" height="69" rx="12"/><circle class="n" cx="50" cy="232" r="14"/><text class="nt" x="50" y="237" text-anchor="middle">3</text><rect x="74" y="220" width="57.2" height="24" rx="12" fill="#3D6BF0"/><text class="b" x="81" y="237">School</text><text class="t" x="74" y="263"><tspan x="74" dy="0">Confirms its official email with a 6-digit code, then submits.</tspan></text><path class="arrow" d="M340.0,277 L340.0,291"/><polygon class="head" points="335.0,287 345.0,287 340.0,295"/><rect class="s s-EduNex" x="24" y="297" width="632" height="69" rx="12"/><circle class="n" cx="50" cy="323" r="14"/><text class="nt" x="50" y="328" text-anchor="middle">4</text><rect x="74" y="311" width="93.2" height="24" rx="12" fill="#4B5563"/><text class="b" x="81" y="328">EduNex team</text><text class="t" x="74" y="354"><tspan x="74" dy="0">Reviews the application.</tspan></text><path class="arrow" d="M340.0,368 L340.0,382"/><polygon class="head" points="335.0,378 345.0,378 340.0,386"/><rect class="q" x="24" y="388" width="632" height="45" rx="12"/><text class="qt" x="42" y="414"><tspan x="42" dy="0">Is everything in order?</tspan></text><path class="arrow" d="M340.0,433 L340.0,443 L124.66666666666667,443 L124.66666666666667,451"/><polygon class="head" points="119.66666666666667,446 129.66666666666669,446 124.66666666666667,454"/><rect class="a" x="24.0" y="455" width="201.33333333333334" height="103" rx="10"/><text class="al" x="38.0" y="477">Yes</text><text class="at" x="38.0" y="498"><tspan x="38.0" dy="0">Approved: the school gets</tspan><tspan x="38.0" dy="19">an email to set its</tspan><tspan x="38.0" dy="19">password.</tspan></text><path class="arrow" d="M340.0,433 L340.0,443 L340.0,443 L340.0,451"/><polygon class="head" points="335.0,446 345.0,446 340.0,454"/><rect class="a" x="239.33333333333334" y="455" width="201.33333333333334" height="103" rx="10"/><text class="al" x="253.33333333333334" y="477">Needs information</text><text class="at" x="253.33333333333334" y="498"><tspan x="253.33333333333334" dy="0">The school corrects and</tspan><tspan x="253.33333333333334" dy="19">submits again.</tspan></text><path class="arrow" d="M340.0,433 L340.0,443 L555.3333333333334,443 L555.3333333333334,451"/><polygon class="head" points="550.3333333333334,446 560.3333333333334,446 555.3333333333334,454"/><rect class="a" x="454.6666666666667" y="455" width="201.33333333333334" height="103" rx="10"/><text class="al" x="468.6666666666667" y="477">No</text><text class="at" x="468.6666666666667" y="498"><tspan x="468.6666666666667" dy="0">Rejected, with the reason.</tspan></text><path class="arrow" d="M124.66666666666667,560 L124.66666666666667,574"/><polygon class="head" points="119.66666666666667,570 129.66666666666669,570 124.66666666666667,578"/><rect class="s s-School" x="24" y="580" width="632" height="69" rx="12"/><circle class="n" cx="50" cy="606" r="14"/><text class="nt" x="50" y="611" text-anchor="middle">5</text><rect x="74" y="594" width="57.2" height="24" rx="12" fill="#3D6BF0"/><text class="b" x="81" y="611">School</text><text class="t" x="74" y="637"><tspan x="74" dy="0">Sets its password and signs in to School administration.</tspan></text></svg>