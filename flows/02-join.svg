<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 654" width="680" height="654" role="img" aria-label="A teacher joins the school"><style>text{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif}.s{stroke:#C9D0DC}.s-School{fill:#E8EEFF}.s-Teacher{fill:#E3F4EC}.s-Headteacher{fill:#FFF1D6}.s-Reviewer{fill:#F3E8FF}.s-Coordinator{fill:#FFE7E7}.s-Officer{fill:#E6F6F8}.s-EduNex{fill:#ECEFF4}.s-App{fill:#F2F4F7}.n{fill:#fff;stroke:#9AA3B5}.nt{font-size:13px;font-weight:700;fill:#1F2633}.b{font-size:12px;font-weight:700;fill:#fff}.t{font-size:15px;fill:#1F2633}.q{fill:#FFF8E1;stroke:#E0B54A}.qt{font-size:15px;font-weight:700;fill:#3D2C08}.a{fill:#fff;stroke:#E0B54A}.al{font-size:13px;font-weight:700;fill:#8A5A00}.at{font-size:14px;fill:#1F2633}.arrow{fill:none;stroke:#8A93A6;stroke-width:2}.head{fill:#8A93A6}</style><rect width="680" height="654" fill="#ffffff"/><title>A teacher joins the school</title><rect class="s s-School" x="24" y="24" width="632" height="69" rx="12"/><circle class="n" cx="50" cy="50" r="14"/><text class="nt" x="50" y="55" text-anchor="middle">1</text><rect x="74" y="38" width="57.2" height="24" rx="12" fill="#3D6BF0"/><text class="b" x="81" y="55">School</text><text class="t" x="74" y="81"><tspan x="74" dy="0">Sends an email invitation, or shows the school&#x27;s QR code.</tspan></text><path class="arrow" d="M340.0,95 L340.0,109"/><polygon class="head" points="335.0,105 345.0,105 340.0,113"/><rect class="s s-Teacher" x="24" y="115" width="632" height="69" rx="12"/><circle class="n" cx="50" cy="141" r="14"/><text class="nt" x="50" y="146" text-anchor="middle">2</text><rect x="74" y="129" width="64.4" height="24" rx="12" fill="#0E7F53"/><text class="b" x="81" y="146">Teacher</text><text class="t" x="74" y="172"><tspan x="74" dy="0">Opens the link and enters their name and DELIMa email.</tspan></text><path class="arrow" d="M340.0,186 L340.0,200"/><polygon class="head" points="335.0,196 345.0,196 340.0,204"/><rect class="q" x="24" y="206" width="632" height="45" rx="12"/><text class="qt" x="42" y="232"><tspan x="42" dy="0">Already has an EduNex account?</tspan></text><path class="arrow" d="M340.0,251 L340.0,261 L178.5,261 L178.5,269"/><polygon class="head" points="173.5,264 183.5,264 178.5,272"/><rect class="a" x="24.0" y="273" width="309.0" height="84" rx="10"/><text class="al" x="38.0" y="295">No</text><text class="at" x="38.0" y="316"><tspan x="38.0" dy="0">Gets a 6-digit code by email, then</tspan><tspan x="38.0" dy="19">chooses a username and password.</tspan></text><path class="arrow" d="M340.0,251 L340.0,261 L501.5,261 L501.5,269"/><polygon class="head" points="496.5,264 506.5,264 501.5,272"/><rect class="a" x="347.0" y="273" width="309.0" height="84" rx="10"/><text class="al" x="361.0" y="295">Yes</text><text class="at" x="361.0" y="316"><tspan x="361.0" dy="0">Signs in with the existing account to</tspan><tspan x="361.0" dy="19">join.</tspan></text><path class="arrow" d="M178.5,359 L178.5,373"/><polygon class="head" points="173.5,369 183.5,369 178.5,377"/><rect class="s s-App" x="24" y="379" width="632" height="69" rx="12"/><circle class="n" cx="50" cy="405" r="14"/><text class="nt" x="50" y="410" text-anchor="middle">3</text><rect x="74" y="393" width="86.0" height="24" rx="12" fill="#6B7280"/><text class="b" x="81" y="410">EduNex app</text><text class="t" x="74" y="436"><tspan x="74" dy="0">Shows “Waiting for approval”.</tspan></text><path class="arrow" d="M340.0,450 L340.0,464"/><polygon class="head" points="335.0,460 345.0,460 340.0,468"/><rect class="s s-School" x="24" y="470" width="632" height="69" rx="12"/><circle class="n" cx="50" cy="496" r="14"/><text class="nt" x="50" y="501" text-anchor="middle">4</text><rect x="74" y="484" width="57.2" height="24" rx="12" fill="#3D6BF0"/><text class="b" x="81" y="501">School</text><text class="t" x="74" y="527"><tspan x="74" dy="0">Approves the teacher under Staff.</tspan></text><path class="arrow" d="M340.0,541 L340.0,555"/><polygon class="head" points="335.0,551 345.0,551 340.0,559"/><rect class="s s-Teacher" x="24" y="561" width="632" height="69" rx="12"/><circle class="n" cx="50" cy="587" r="14"/><text class="nt" x="50" y="592" text-anchor="middle">5</text><rect x="74" y="575" width="64.4" height="24" rx="12" fill="#0E7F53"/><text class="b" x="81" y="592">Teacher</text><text class="t" x="74" y="618"><tspan x="74" dy="0">Signs in and sees their Home page.</tspan></text></svg>