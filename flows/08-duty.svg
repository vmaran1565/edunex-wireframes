<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 337" width="680" height="337" role="img" aria-label="Giving a teacher a duty"><style>text{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif}.s{stroke:#C9D0DC}.s-School{fill:#E8EEFF}.s-Teacher{fill:#E3F4EC}.s-Headteacher{fill:#FFF1D6}.s-Reviewer{fill:#F3E8FF}.s-Coordinator{fill:#FFE7E7}.s-Officer{fill:#E6F6F8}.s-EduNex{fill:#ECEFF4}.s-App{fill:#F2F4F7}.n{fill:#fff;stroke:#9AA3B5}.nt{font-size:13px;font-weight:700;fill:#1F2633}.b{font-size:12px;font-weight:700;fill:#fff}.t{font-size:15px;fill:#1F2633}.q{fill:#FFF8E1;stroke:#E0B54A}.qt{font-size:15px;font-weight:700;fill:#3D2C08}.a{fill:#fff;stroke:#E0B54A}.al{font-size:13px;font-weight:700;fill:#8A5A00}.at{font-size:14px;fill:#1F2633}.arrow{fill:none;stroke:#8A93A6;stroke-width:2}.head{fill:#8A93A6}</style><rect width="680" height="337" fill="#ffffff"/><title>Giving a teacher a duty</title><rect class="s s-School" x="24" y="24" width="632" height="88" rx="12"/><circle class="n" cx="50" cy="50" r="14"/><text class="nt" x="50" y="55" text-anchor="middle">1</text><rect x="74" y="38" width="57.2" height="24" rx="12" fill="#3D6BF0"/><text class="b" x="81" y="55">School</text><text class="t" x="74" y="81"><tspan x="74" dy="0">Staff → Duties → chooses the duty (for example relief coordinator),</tspan><tspan x="74" dy="19">the scope and the dates.</tspan></text><path class="arrow" d="M340.0,114 L340.0,128"/><polygon class="head" points="335.0,124 345.0,124 340.0,132"/><rect class="s s-App" x="24" y="134" width="632" height="88" rx="12"/><circle class="n" cx="50" cy="160" r="14"/><text class="nt" x="50" y="165" text-anchor="middle">2</text><rect x="74" y="148" width="86.0" height="24" rx="12" fill="#6B7280"/><text class="b" x="81" y="165">EduNex app</text><text class="t" x="74" y="191"><tspan x="74" dy="0">The teacher gets that duty&#x27;s screens and rights, only between those</tspan><tspan x="74" dy="19">dates.</tspan></text><path class="arrow" d="M340.0,224 L340.0,238"/><polygon class="head" points="335.0,234 345.0,234 340.0,242"/><rect class="s s-School" x="24" y="244" width="632" height="69" rx="12"/><circle class="n" cx="50" cy="270" r="14"/><text class="nt" x="50" y="275" text-anchor="middle">3</text><rect x="74" y="258" width="57.2" height="24" rx="12" fill="#3D6BF0"/><text class="b" x="81" y="275">School</text><text class="t" x="74" y="301"><tspan x="74" dy="0">Ends the duty early if needed; the history is kept.</tspan></text></svg>