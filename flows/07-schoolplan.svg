<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 516" width="680" height="516" role="img" aria-label="The school plan and its reminders"><style>text{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif}.s{stroke:#C9D0DC}.s-School{fill:#E8EEFF}.s-Teacher{fill:#E3F4EC}.s-Headteacher{fill:#FFF1D6}.s-Reviewer{fill:#F3E8FF}.s-Coordinator{fill:#FFE7E7}.s-Officer{fill:#E6F6F8}.s-EduNex{fill:#ECEFF4}.s-App{fill:#F2F4F7}.n{fill:#fff;stroke:#9AA3B5}.nt{font-size:13px;font-weight:700;fill:#1F2633}.b{font-size:12px;font-weight:700;fill:#fff}.t{font-size:15px;fill:#1F2633}.q{fill:#FFF8E1;stroke:#E0B54A}.qt{font-size:15px;font-weight:700;fill:#3D2C08}.a{fill:#fff;stroke:#E0B54A}.al{font-size:13px;font-weight:700;fill:#8A5A00}.at{font-size:14px;fill:#1F2633}.arrow{fill:none;stroke:#8A93A6;stroke-width:2}.head{fill:#8A93A6}</style><rect width="680" height="516" fill="#ffffff"/><title>The school plan and its reminders</title><rect class="s s-School" x="24" y="24" width="632" height="88" rx="12"/><circle class="n" cx="50" cy="50" r="14"/><text class="nt" x="50" y="55" text-anchor="middle">1</text><rect x="74" y="38" width="57.2" height="24" rx="12" fill="#3D6BF0"/><text class="b" x="81" y="55">School</text><text class="t" x="74" y="81"><tspan x="74" dy="0">Uploads the existing yearly plan (Excel, or a PDF or photo with the AI</tspan><tspan x="74" dy="19">add-on), or types events in.</tspan></text><path class="arrow" d="M340.0,114 L340.0,128"/><polygon class="head" points="335.0,124 345.0,124 340.0,132"/><rect class="s s-School" x="24" y="134" width="632" height="69" rx="12"/><circle class="n" cx="50" cy="160" r="14"/><text class="nt" x="50" y="165" text-anchor="middle">2</text><rect x="74" y="148" width="57.2" height="24" rx="12" fill="#3D6BF0"/><text class="b" x="81" y="165">School</text><text class="t" x="74" y="191"><tspan x="74" dy="0">Checks the draft events, picks each coordinator, and confirms.</tspan></text><path class="arrow" d="M340.0,205 L340.0,219"/><polygon class="head" points="335.0,215 345.0,215 340.0,223"/><rect class="s s-App" x="24" y="225" width="632" height="88" rx="12"/><circle class="n" cx="50" cy="251" r="14"/><text class="nt" x="50" y="256" text-anchor="middle">3</text><rect x="74" y="239" width="86.0" height="24" rx="12" fill="#6B7280"/><text class="b" x="81" y="256">EduNex app</text><text class="t" x="74" y="282"><tspan x="74" dy="0">Reminds the coordinator 30 days before, 7 days before, on the day and</tspan><tspan x="74" dy="19">7 days after; meetings get a 2-week notice.</tspan></text><path class="arrow" d="M340.0,315 L340.0,329"/><polygon class="head" points="335.0,325 345.0,325 340.0,333"/><rect class="q" x="24" y="335" width="632" height="45" rx="12"/><text class="qt" x="42" y="361"><tspan x="42" dy="0">Plans change?</tspan></text><path class="arrow" d="M340.0,380 L340.0,390 L178.5,390 L178.5,398"/><polygon class="head" points="173.5,393 183.5,393 178.5,401"/><rect class="a" x="24.0" y="402" width="309.0" height="84" rx="10"/><text class="al" x="38.0" y="424">Postponed</text><text class="at" x="38.0" y="445"><tspan x="38.0" dy="0">Shows what is affected; reminders move</tspan><tspan x="38.0" dy="19">to the new date.</tspan></text><path class="arrow" d="M340.0,380 L340.0,390 L501.5,390 L501.5,398"/><polygon class="head" points="496.5,393 506.5,393 501.5,401"/><rect class="a" x="347.0" y="402" width="309.0" height="84" rx="10"/><text class="al" x="361.0" y="424">Cancelled</text><text class="at" x="361.0" y="445"><tspan x="361.0" dy="0">Reminders stop.</tspan></text></svg>