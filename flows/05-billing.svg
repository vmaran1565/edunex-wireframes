<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 601" width="680" height="601" role="img" aria-label="Paying for EduNex"><style>text{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif}.s{stroke:#C9D0DC}.s-School{fill:#E8EEFF}.s-Teacher{fill:#E3F4EC}.s-Headteacher{fill:#FFF1D6}.s-Reviewer{fill:#F3E8FF}.s-Coordinator{fill:#FFE7E7}.s-Officer{fill:#E6F6F8}.s-EduNex{fill:#ECEFF4}.s-App{fill:#F2F4F7}.n{fill:#fff;stroke:#9AA3B5}.nt{font-size:13px;font-weight:700;fill:#1F2633}.b{font-size:12px;font-weight:700;fill:#fff}.t{font-size:15px;fill:#1F2633}.q{fill:#FFF8E1;stroke:#E0B54A}.qt{font-size:15px;font-weight:700;fill:#3D2C08}.a{fill:#fff;stroke:#E0B54A}.al{font-size:13px;font-weight:700;fill:#8A5A00}.at{font-size:14px;fill:#1F2633}.arrow{fill:none;stroke:#8A93A6;stroke-width:2}.head{fill:#8A93A6}</style><rect width="680" height="601" fill="#ffffff"/><title>Paying for EduNex</title><rect class="s s-EduNex" x="24" y="24" width="632" height="69" rx="12"/><circle class="n" cx="50" cy="50" r="14"/><text class="nt" x="50" y="55" text-anchor="middle">1</text><rect x="74" y="38" width="93.2" height="24" rx="12" fill="#4B5563"/><text class="b" x="81" y="55">EduNex team</text><text class="t" x="74" y="81"><tspan x="74" dy="0">Issues the school&#x27;s invoice.</tspan></text><path class="arrow" d="M340.0,95 L340.0,109"/><polygon class="head" points="335.0,105 345.0,105 340.0,113"/><rect class="s s-School" x="24" y="115" width="632" height="88" rx="12"/><circle class="n" cx="50" cy="141" r="14"/><text class="nt" x="50" y="146" text-anchor="middle">2</text><rect x="74" y="129" width="57.2" height="24" rx="12" fill="#3D6BF0"/><text class="b" x="81" y="146">School</text><text class="t" x="74" y="172"><tspan x="74" dy="0">Sees it under Billing, pays by bank transfer and uploads the payment</tspan><tspan x="74" dy="19">slip.</tspan></text><path class="arrow" d="M340.0,205 L340.0,219"/><polygon class="head" points="335.0,215 345.0,215 340.0,223"/><rect class="s s-EduNex" x="24" y="225" width="632" height="69" rx="12"/><circle class="n" cx="50" cy="251" r="14"/><text class="nt" x="50" y="256" text-anchor="middle">3</text><rect x="74" y="239" width="93.2" height="24" rx="12" fill="#4B5563"/><text class="b" x="81" y="256">EduNex team</text><text class="t" x="74" y="282"><tspan x="74" dy="0">Checks the payment.</tspan></text><path class="arrow" d="M340.0,296 L340.0,310"/><polygon class="head" points="335.0,306 345.0,306 340.0,314"/><rect class="q" x="24" y="316" width="632" height="45" rx="12"/><text class="qt" x="42" y="342"><tspan x="42" dy="0">Payment received?</tspan></text><path class="arrow" d="M340.0,361 L340.0,371 L178.5,371 L178.5,379"/><polygon class="head" points="173.5,374 183.5,374 178.5,382"/><rect class="a" x="24.0" y="383" width="309.0" height="84" rx="10"/><text class="al" x="38.0" y="405">Yes</text><text class="at" x="38.0" y="426"><tspan x="38.0" dy="0">Confirmed: the school gets a receipt.</tspan></text><path class="arrow" d="M340.0,361 L340.0,371 L501.5,371 L501.5,379"/><polygon class="head" points="496.5,374 506.5,374 501.5,382"/><rect class="a" x="347.0" y="383" width="309.0" height="84" rx="10"/><text class="al" x="361.0" y="405">Not found</text><text class="at" x="361.0" y="426"><tspan x="361.0" dy="0">The school is told and can send proof</tspan><tspan x="361.0" dy="19">again.</tspan></text><path class="arrow" d="M178.5,469 L178.5,483"/><polygon class="head" points="173.5,479 183.5,479 178.5,487"/><rect class="s s-App" x="24" y="489" width="632" height="88" rx="12"/><circle class="n" cx="50" cy="515" r="14"/><text class="nt" x="50" y="520" text-anchor="middle">4</text><rect x="74" y="503" width="86.0" height="24" rx="12" fill="#6B7280"/><text class="b" x="81" y="520">EduNex app</text><text class="t" x="74" y="546"><tspan x="74" dy="0">If an invoice is overdue, a notice shows. All work carries on as</tspan><tspan x="74" dy="19">normal.</tspan></text></svg>