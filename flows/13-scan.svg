<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 481" width="680" height="481" role="img" aria-label="Timetable from a photo or PDF"><style>text{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif}.s{stroke:#C9D0DC}.s-School{fill:#E8EEFF}.s-Teacher{fill:#E3F4EC}.s-Headteacher{fill:#FFF1D6}.s-Reviewer{fill:#F3E8FF}.s-Coordinator{fill:#FFE7E7}.s-Officer{fill:#E6F6F8}.s-EduNex{fill:#ECEFF4}.s-App{fill:#F2F4F7}.n{fill:#fff;stroke:#9AA3B5}.nt{font-size:13px;font-weight:700;fill:#1F2633}.b{font-size:12px;font-weight:700;fill:#fff}.t{font-size:15px;fill:#1F2633}.q{fill:#FFF8E1;stroke:#E0B54A}.qt{font-size:15px;font-weight:700;fill:#3D2C08}.a{fill:#fff;stroke:#E0B54A}.al{font-size:13px;font-weight:700;fill:#8A5A00}.at{font-size:14px;fill:#1F2633}.arrow{fill:none;stroke:#8A93A6;stroke-width:2}.head{fill:#8A93A6}</style><rect width="680" height="481" fill="#ffffff"/><title>Timetable from a photo or PDF</title><rect class="s s-Coordinator" x="24" y="24" width="632" height="69" rx="12"/><circle class="n" cx="50" cy="50" r="14"/><text class="nt" x="50" y="55" text-anchor="middle">1</text><rect x="74" y="38" width="143.6" height="24" rx="12" fill="#CC0001"/><text class="b" x="81" y="55">Relief coordinator</text><text class="t" x="74" y="81"><tspan x="74" dy="0">Uploads a photo, scan or PDF of the timetable.</tspan></text><path class="arrow" d="M340.0,95 L340.0,109"/><polygon class="head" points="335.0,105 345.0,105 340.0,113"/><rect class="s s-App" x="24" y="115" width="632" height="69" rx="12"/><circle class="n" cx="50" cy="141" r="14"/><text class="nt" x="50" y="146" text-anchor="middle">2</text><rect x="74" y="129" width="86.0" height="24" rx="12" fill="#6B7280"/><text class="b" x="81" y="146">EduNex app</text><text class="t" x="74" y="172"><tspan x="74" dy="0">Reads it into a draft and marks anything unclear.</tspan></text><path class="arrow" d="M340.0,186 L340.0,200"/><polygon class="head" points="335.0,196 345.0,196 340.0,204"/><rect class="s s-Coordinator" x="24" y="206" width="632" height="69" rx="12"/><circle class="n" cx="50" cy="232" r="14"/><text class="nt" x="50" y="237" text-anchor="middle">3</text><rect x="74" y="220" width="143.6" height="24" rx="12" fill="#CC0001"/><text class="b" x="81" y="237">Relief coordinator</text><text class="t" x="74" y="263"><tspan x="74" dy="0">Checks the draft beside the picture and fixes the marked cells.</tspan></text><path class="arrow" d="M340.0,277 L340.0,291"/><polygon class="head" points="335.0,287 345.0,287 340.0,295"/><rect class="s s-Coordinator" x="24" y="297" width="632" height="69" rx="12"/><circle class="n" cx="50" cy="323" r="14"/><text class="nt" x="50" y="328" text-anchor="middle">4</text><rect x="74" y="311" width="143.6" height="24" rx="12" fill="#CC0001"/><text class="b" x="81" y="328">Relief coordinator</text><text class="t" x="74" y="354"><tspan x="74" dy="0">Turns the checked import into a draft timetable version.</tspan></text><path class="arrow" d="M340.0,368 L340.0,382"/><polygon class="head" points="335.0,378 345.0,378 340.0,386"/><rect class="s s-Headteacher" x="24" y="388" width="632" height="69" rx="12"/><circle class="n" cx="50" cy="414" r="14"/><text class="nt" x="50" y="419" text-anchor="middle">5</text><rect x="74" y="402" width="93.2" height="24" rx="12" fill="#B7791F"/><text class="b" x="81" y="419">Headteacher</text><text class="t" x="74" y="445"><tspan x="74" dy="0">Publishes it, as for any timetable.</tspan></text></svg>