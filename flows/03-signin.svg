<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 491" width="680" height="491" role="img" aria-label="Signing in and changing school"><style>text{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif}.s{stroke:#C9D0DC}.s-School{fill:#E8EEFF}.s-Teacher{fill:#E3F4EC}.s-Headteacher{fill:#FFF1D6}.s-Reviewer{fill:#F3E8FF}.s-Coordinator{fill:#FFE7E7}.s-Officer{fill:#E6F6F8}.s-EduNex{fill:#ECEFF4}.s-App{fill:#F2F4F7}.n{fill:#fff;stroke:#9AA3B5}.nt{font-size:13px;font-weight:700;fill:#1F2633}.b{font-size:12px;font-weight:700;fill:#fff}.t{font-size:15px;fill:#1F2633}.q{fill:#FFF8E1;stroke:#E0B54A}.qt{font-size:15px;font-weight:700;fill:#3D2C08}.a{fill:#fff;stroke:#E0B54A}.al{font-size:13px;font-weight:700;fill:#8A5A00}.at{font-size:14px;fill:#1F2633}.arrow{fill:none;stroke:#8A93A6;stroke-width:2}.head{fill:#8A93A6}</style><rect width="680" height="491" fill="#ffffff"/><title>Signing in and changing school</title><rect class="s s-Teacher" x="24" y="24" width="632" height="88" rx="12"/><circle class="n" cx="50" cy="50" r="14"/><text class="nt" x="50" y="55" text-anchor="middle">1</text><rect x="74" y="38" width="64.4" height="24" rx="12" fill="#0E7F53"/><text class="b" x="81" y="55">Teacher</text><text class="t" x="74" y="81"><tspan x="74" dy="0">Enters username or email and password (or uses Google DELIMa, when</tspan><tspan x="74" dy="19">switched on).</tspan></text><path class="arrow" d="M340.0,114 L340.0,128"/><polygon class="head" points="335.0,124 345.0,124 340.0,132"/><rect class="s s-App" x="24" y="134" width="632" height="69" rx="12"/><circle class="n" cx="50" cy="160" r="14"/><text class="nt" x="50" y="165" text-anchor="middle">2</text><rect x="74" y="148" width="86.0" height="24" rx="12" fill="#6B7280"/><text class="b" x="81" y="165">EduNex app</text><text class="t" x="74" y="191"><tspan x="74" dy="0">Opens the school used last time, on the Home page.</tspan></text><path class="arrow" d="M340.0,205 L340.0,219"/><polygon class="head" points="335.0,215 345.0,215 340.0,223"/><rect class="q" x="24" y="225" width="632" height="45" rx="12"/><text class="qt" x="42" y="251"><tspan x="42" dy="0">Works in more than one school?</tspan></text><path class="arrow" d="M340.0,270 L340.0,280 L178.5,280 L178.5,288"/><polygon class="head" points="173.5,283 183.5,283 178.5,291"/><rect class="a" x="24.0" y="292" width="309.0" height="84" rx="10"/><text class="al" x="38.0" y="314">Yes</text><text class="at" x="38.0" y="335"><tspan x="38.0" dy="0">Account menu → Change school → Open the</tspan><tspan x="38.0" dy="19">other school.</tspan></text><path class="arrow" d="M340.0,270 L340.0,280 L501.5,280 L501.5,288"/><polygon class="head" points="496.5,283 506.5,283 501.5,291"/><rect class="a" x="347.0" y="292" width="309.0" height="84" rx="10"/><text class="al" x="361.0" y="314">No</text><text class="at" x="361.0" y="335"><tspan x="361.0" dy="0">Carries on working.</tspan></text><path class="arrow" d="M178.5,378 L178.5,392"/><polygon class="head" points="173.5,388 183.5,388 178.5,396"/><rect class="s s-Teacher" x="24" y="398" width="632" height="69" rx="12"/><circle class="n" cx="50" cy="424" r="14"/><text class="nt" x="50" y="429" text-anchor="middle">3</text><rect x="74" y="412" width="64.4" height="24" rx="12" fill="#0E7F53"/><text class="b" x="81" y="429">Teacher</text><text class="t" x="74" y="455"><tspan x="74" dy="0">Signs out from the account menu when done.</tspan></text></svg>